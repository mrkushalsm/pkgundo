// pkgundo: auto-track newly, explicitly installed packages and remind you
// to review a tracked app's accumulated $HOME mutations after it's
// removed. One Pre/Post pair covers both halves (apt has no
// install-vs-remove hook split like pacman's) via a snapshot-diff of the
// installed package list.
//
// `|| true`: apt parses this file's hook commands once at the start of
// the whole transaction, so a transaction that removes pkgundo itself
// (e.g. `apt remove pkgundo` when installed as a native package) still
// tries to run `/usr/bin/pkgundo apt-hook-post` after dpkg has already
// deleted that same binary — the shell's own "command not found" (exit
// 127) would otherwise fail the entire transaction with a scary-looking
// but harmless error. This can't be caught inside pkgundo's own error
// handling (the binary is simply gone by then), so it's handled here.
DPkg::Pre-Invoke {"/usr/bin/pkgundo apt-hook-pre || true";};
DPkg::Post-Invoke {"/usr/bin/pkgundo apt-hook-post || true";};
